<script>
/* 見た目の設定(早めに読み込んで、表示のちらつきを防ぐ) */
(function () {
  var LS_SET = 'gaman-settings-v1';
  var VARS = ['--bg', '--surface', '--ink', '--muted', '--line', '--hero-bg', '--accent', '--accent-ink'];
  function lin(v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }

  function css(c) { return 'rgb(' + c.join(',') + ')'; }
  function clamp(n) { n = Math.round(Number(n)); return isNaN(n) ? 0 : Math.max(0, Math.min(255, n)); }
  function okRgb(c) { return Array.isArray(c) && c.length === 3 ? c.map(clamp) : null; }
  function defaults() { return { theme: 'light', bg: [255, 255, 255], accent: null }; }
  function load() {
    var d = defaults();
    try {
      var s = JSON.parse(localStorage.getItem(LS_SET) || 'null');
      if (s && typeof s === 'object') {
        if (['light', 'dark', 'system', 'custom'].indexOf(s.theme) >= 0) d.theme = s.theme;
        d.bg = okRgb(s.bg) || d.bg;
        d.accent = okRgb(s.accent);
      }
    } catch (e) {}
    return d;
  }
  function save(s) { try { localStorage.setItem(LS_SET, JSON.stringify(s)); return true; } catch (e) { return false; } }
  function parseColor(s) {
    s = (s || '').trim();
    var m = s.match(/^#([0-9a-f]{6})$/i);
    if (m) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
    m = s.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
    return m ? [+m[1], +m[2], +m[3]] : null;
  }
  function cssVar(name) { return parseColor(getComputedStyle(document.documentElement).getPropertyValue(name)); }
  function apply(s) {
    var root = document.documentElement, st = root.style;
    VARS.forEach(function (k) { st.removeProperty(k); });
    if (s.theme === 'custom') {
      var bg = s.bg, dark = lum(bg) < 0.4;
      var ink = dark ? [238, 242, 251] : [21, 32, 59];
      root.setAttribute('data-gtheme', dark ? 'dark' : 'light');
      st.setProperty('--bg', css(bg));
      st.setProperty('--surface', css(dark ? mix(bg, [255, 255, 255], 0.07) : mix(bg, [255, 255, 255], 0.6)));
      st.setProperty('--ink', css(ink));
      st.setProperty('--muted', css(mix(ink, bg, 0.4)));
      st.setProperty('--line', css(mix(bg, ink, 0.16)));
      st.setProperty('--hero-bg', css(mix(bg, ink, 0.07)));

      root.setAttribute('data-gtheme', s.theme);
    }
    if (s.accent) {
      st.setProperty('--accent', css(s.accent));
      st.setProperty('--accent-ink', css(lum(s.accent) > 0.42 ? [30, 22, 0] : [255, 255, 255]));

      var meta = document.querySelector('meta[name="theme-color"]'), c = cssVar('--bg');

  apply(load());
})();

      ping(ac, master, t + 0.2, 2637, 1.0, 0.35);   // きらめき
    } catch (e) {}
  }
  try { soundOn = localStorage.getItem(LS_SND) !== 'off'; } catch (e) {}
  function paintSnd() { var b = $('snd'); b.textContent = soundOn ? '音 ON' : '音 OFF'; b.setAttribute('aria-pressed', String(soundOn)); }
  paintSnd();
  $('snd').addEventListener('click', function () {
    soundOn = !soundOn; paintSnd();
    try { localStorage.setItem(LS_SND, soundOn ? 'on' : 'off'); } catch (e) {}
    if (soundOn) chalin();
  });

  /* ---------- 演出 ---------- */
  var cheerTimer = null, msgs = ['我慢えらい!', 'ナイス我慢!', 'ちゃんと我慢できた!', 'その調子!', 'ちりつも、ちりつも!'];
  function hideCheer() {
    var el = $('cheer');
    if (el.hidden) return;
    clearTimeout(cheerTimer);
    el.classList.remove('show'); el.classList.add('hide');
    setTimeout(function () { el.hidden = true; el.classList.remove('hide'); $('coins').textContent = ''; }, 350);
  }
  function cheer(price) {
    var el = $('cheer');
    clearTimeout(cheerTimer);
    $('cheerAmt').textContent = '+' + yen(price) + '円';
    $('cheerMsg').textContent = msgs[Math.floor(Math.random() * msgs.length)];
    var coins = $('coins'); coins.textContent = '';
    if (!reduce) {
      for (var i = 0; i < 18; i++) {
        var c = document.createElement('div'); c.className = 'coin';
        c.style.left = (Math.random() * 94 + 1) + '%';
        c.style.setProperty('--delay', (Math.random() * 0.9).toFixed(2) + 's');
        c.style.setProperty('--dur', (1.3 + Math.random() * 0.8).toFixed(2) + 's');
        c.style.setProperty('--rot', (Math.random() > .5 ? 1 : -1) * (360 + Math.random() * 360) + 'deg');
        coins.appendChild(c);
      }
    }
    var bd = $('badge'); bd.classList.remove('pop'); void bd.offsetWidth; bd.classList.add('pop');
    el.classList.remove('hide'); el.hidden = false;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
    cheerTimer = setTimeout(hideCheer, 3000);
  }
  $('cheer').addEventListener('click', hideCheer);

  /* ---------- 記録 ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function yen(n) { return Math.round(n).toLocaleString('ja-JP'); }
  function fmtDate(s) {
    var p = s.split('-').map(Number);
    return p[1] + '月' + p[2] + '日(' + '日月火水木金土'[new Date(p[0], p[1] - 1, p[2]).getDay()] + ')';
  }
  function monthTitle(k) { var p = k.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(entries)); return true; } catch (e) { return false; } }
  function loadLocal() { try { var v = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }

  function setNum(el, to) {
    var from = Number(el.dataset.v || 0);
    el.dataset.v = to;
    if (reduce || from === to) { el.textContent = yen(to); return; }
    var t0 = performance.now(), dur = 700;
    (function step(t) {
      var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = yen(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step); else el.textContent = yen(to);
    })(t0);
  }

  function render() {
    var sorted = entries.slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0);
    });
    var nowKey = todayStr().slice(0, 7), total = 0, month = 0;
    sorted.forEach(function (e) { total += e.price; if (e.date.slice(0, 7) === nowKey) month += e.price; });
    setNum($('total'), total); setNum($('monthTotal'), month);
    $('count').textContent = sorted.length;
    $('monthLabel').textContent = Number(nowKey.split('-')[1]) + '月の合計';

    var box = $('groups'); box.textContent = '';
    if (!sorted.length) {
      var em = document.createElement('div'); em.className = 'empty';
      var b = document.createElement('b'); b.textContent = 'まだ記録がありません';
      em.appendChild(b); em.appendChild(document.createTextNode('欲しい物を我慢したら、上のフォームに値段を入れてみましょう。'));
      box.appendChild(em); return;
    }
    var groups = {}, order = [];
    sorted.forEach(function (e) {
      var k = e.date.slice(0, 7);
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(e);
    });
    order.forEach(function (k) {
      var g = document.createElement('div');
      var sum = groups[k].reduce(function (s, e) { return s + e.price; }, 0);
      var h = document.createElement('div'); h.className = 'month';
      var h3 = document.createElement('h3'); h3.textContent = monthTitle(k);
      var mt = document.createElement('span'); mt.className = 'mt'; mt.textContent = '+' + yen(sum) + '円';
      h.appendChild(h3); h.appendChild(mt); g.appendChild(h);
      var ul = document.createElement('ul'); ul.className = 'ledger';
      groups[k].forEach(function (e) {
        var li = document.createElement('li'); li.className = 'row';
        var d = document.createElement('span'); d.className = 'd'; d.textContent = fmtDate(e.date);
        var n = document.createElement('span'); n.className = 'n'; n.textContent = e.item;
        var p = document.createElement('span'); p.className = 'p'; p.textContent = '+' + yen(e.price) + '円';
        var x = document.createElement('button'); x.className = 'x'; x.type = 'button';
        x.setAttribute('aria-label', e.item + 'を削除'); x.textContent = '×';
        x.addEventListener('click', function () { pendingDelete = e.id; render(); });
        li.appendChild(d); li.appendChild(n); li.appendChild(p); li.appendChild(x);
        if (pendingDelete === e.id) {
          var c = document.createElement('div'); c.className = 'confirm';
          c.appendChild(document.createTextNode('この記録を削除しますか?'));
          var no = document.createElement('button'); no.type = 'button'; no.textContent = 'やめる';
          no.addEventListener('click', function () { pendingDelete = null; render(); });
          var yes = document.createElement('button'); yes.type = 'button'; yes.className = 'del'; yes.textContent = '削除する';
          yes.addEventListener('click', function () {
            entries = entries.filter(function (x2) { return x2.id !== e.id; });
            pendingDelete = null; saveLocal(); render();
          });
          c.appendChild(no); c.appendChild(yes); li.appendChild(c);
        }
        ul.appendChild(li);
      });
      g.appendChild(ul); box.appendChild(g);
    });
  }

  function say(text, kind) { var m = $('msg'); m.textContent = text; m.className = 'msg ' + (kind || ''); }
  function invalid(id, on) { $(id).classList.toggle('invalid', !!on); }

  function addEntry() {
    try {
      var item = $('item').value.trim();
      var price = Math.round(Number($('price').value));
      var date = $('date').value || todayStr();
      invalid('item', false); invalid('price', false);
      if (!item) { invalid('item', true); say('「何を我慢した？」を入力してください。', 'err'); $('item').focus(); return; }
      if (!(price > 0)) { invalid('price', true); say('値段を1円以上の数字で入力してください。', 'err'); $('price').focus(); return; }
      entries.push({ id: 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: date, item: item, price: price, createdAt: Date.now() });
      var saved = saveLocal();
      chalin();          // ボタンを押した操作の中で鳴らす (iOS対策)
      cheer(price);
      $('item').value = ''; $('price').value = '';
      say(saved ? '記録しました。' : '記録しました(この表示では保存されません)。', saved ? 'ok' : 'err');
      render();
    } catch (e) {
      say('エラーが起きました: ' + (e && e.message ? e.message : e), 'err');
    }
  }
  $('add').addEventListener('click', addEntry);
  ['item', 'price', 'date'].forEach(function (id) {
    $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addEntry(); } });
    $(id).addEventListener('input', function () { invalid(id, false); });
  });

  /* ---------- 設定 ---------- */
  var S = T.load();
  function toHex(c) { return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join(''); }

  function colorCtl(box, label, onChange) {
    var cur = [0, 0, 0], names = ['R', 'G', 'B'], ranges = [], nums = [];
    var top = document.createElement('div'); top.className = 'ctl-top';
    var sw = document.createElement('div'); sw.className = 'swatch';
    var hex = document.createElement('input'); hex.type = 'text'; hex.maxLength = 7; hex.setAttribute('aria-label', label + 'の16進カラーコード'); hex.spellcheck = false;
    top.appendChild(sw); top.appendChild(hex); box.appendChild(top);
    function paint(skip) {
      sw.style.background = 'rgb(' + cur.join(',') + ')';
      if (document.activeElement !== hex || skip) hex.value = toHex(cur);
      for (var i = 0; i < 3; i++) {
        ranges[i].value = cur[i];
        if (document.activeElement !== nums[i]) nums[i].value = cur[i];
      }
    }
    names.forEach(function (n, i) {
      var row = document.createElement('div'); row.className = 'ch';
      var b = document.createElement('b'); b.textContent = n;
      var r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 255; r.step = 1; r.setAttribute('aria-label', label + ' ' + n);
      var m = document.createElement('input'); m.type = 'number'; m.min = 0; m.max = 255; m.step = 1; m.inputMode = 'numeric'; m.setAttribute('aria-label', label + ' ' + n + 'の数値');
      r.addEventListener('input', function () { cur[i] = T.clamp(r.value); paint(); onChange(cur.slice()); });
      m.addEventListener('input', function () { if (m.value === '') return; cur[i] = T.clamp(m.value); paint(); onChange(cur.slice()); });
      m.addEventListener('blur', function () { m.value = cur[i]; });
      ranges.push(r); nums.push(m);
      row.appendChild(b); row.appendChild(r); row.appendChild(m); box.appendChild(row);
    });
    hex.addEventListener('input', function () {
      var c = T.parseColor(hex.value.charAt(0) === '#' ? hex.value : '#' + hex.value);
      if (c) { cur = c; paint(); onChange(cur.slice()); }
    });
    hex.addEventListener('blur', function () { hex.value = toHex(cur); });
    return { set: function (rgb) { cur = rgb.slice(); paint(true); } };
  }

  var bgCtl = colorCtl($('bgCtl'), '背景', function (rgb) { S.theme = 'custom'; S.bg = rgb; commit(false); });
  var acCtl = colorCtl($('acCtl'), 'ボタン', function (rgb) { S.accent = rgb; commit(false); });

  function syncUi(skipBg, skipAc) {
    var btns = $('seg').querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-checked', String(btns[i].getAttribute('data-t') === S.theme));
    if (!skipBg) { var b = T.cssVar('--bg'); if (b) bgCtl.set(b); }
    if (!skipAc) { var a = T.cssVar('--accent'); if (a) acCtl.set(a); }
  }
  function commit(refreshSliders) {
    T.apply(S); T.save(S);
    syncUi(!refreshSliders && S.theme === 'custom', !refreshSliders && !!S.accent);
  }
  $('seg').addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('button[data-t]');
    if (!t) return;
    var next = t.getAttribute('data-t');
    if (next === 'custom' && S.theme !== 'custom') { var c = T.cssVar('--bg'); if (c) S.bg = c; }
    S.theme = next; commit(true);
  });
  $('acReset').addEventListener('click', function () { S.accent = null; commit(true); });
  $('resetAll').addEventListener('click', function () { S = T.defaults(); commit(true); });

  var lastFocus = null;
  function openSheet() { lastFocus = document.activeElement; syncUi(false, false); $('sheet').hidden = false; document.body.style.overflow = 'hidden'; $('closeSet').focus(); }
  function closeSheet() { if ($('sheet').hidden) return; $('sheet').hidden = true; document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $('openSet').addEventListener('click', openSheet);
  $('closeSet').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function (e) { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); hideCheer(); } });

  $('date').value = todayStr();
  entries = loadLocal();
  render();
  syncUi(false, false);

})();
</script>

</body></html>
